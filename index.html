<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>(نظام اداره نتائج الطلاب)</title>
</head>
<link rel="stylesheet" href="css/style.css">
<body>
    <h1>(نظام اداره نتائج الطلاب)</h1>
    <label> اسم الطالب:</label>
    <input type="text" id="name" placeholder="اسم الطالب"><br><br>


    <label>المادة الاولي :</label>
    <input type="number"id="grade1" placeholder="ادخل الدرجة الاولي"><br><br>
    <label>المادة الثانيه : </label>
    <input type="number"id="grade2" placeholder="ادخل الدرجة الثانيه"><br><br>
   <label>المادة الثالثه :</label>
    <input type="number"id="grade3" placeholder="ادخل الدرجة الثالثه"><br><br>
    <label> نسبه الحضور (%):</label>
    <input type="number"id="attendance" placeholder="نسبه الحضور"><br><br>
    <button id="addBtn">اضافه طالب</button>
    <button id="mercyBtn">تفعيل لجنه الرافه</button><br><br>
    <h2></h2><br>
    <div id="error"></div><br><br>
    <h2> قائمه الطلاب :</h2><br>
    <div id="student"></div><br><br>
    <h2> التقرير النهائي :</h2><br>
    <div id="report"></div>

    <script src="javascript/script.js"></script>


    
    
</body>
</html>
